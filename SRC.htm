<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 3.2 Final//EN">
<HTML>
<HEAD>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<TITLE>Estructura de cSrc</TITLE>

<style>
.controles-src { vertical-align: middle !important; text-align: center; padding: 4px !important; width: 1%; white-space: nowrap; }
.controles-src .pila { display: flex; flex-direction: column; align-items: stretch; gap: 0; }
.controles-src input[type="button"] { margin: 3px !important; min-width: 64px; white-space: nowrap; }
.tabla-src { width: min-content !important; margin: 0 auto; }
.controles-src label { margin: 3px; white-space: nowrap; }
.cabecera-src font[size="+2"] { font-size: 1.35em; }
/* Botones con el mismo color que aplican al modelo */
.controles-src input.b-sh1  { background: #00FF00; color: #000; border-color: #00b000; }
.controles-src input.b-sh2  { background: #FF0000; color: #fff; border-color: #b00000; }
.controles-src input.b-sh3  { background: #0000FF; color: #fff; border-color: #0000b0; }
.controles-src input.b-sh1:hover, .controles-src input.b-sh2:hover,
.controles-src input.b-sh3:hover { filter: brightness(0.85); }
.leyenda-src { margin-top: 10px; display: flex; flex-direction: column; gap: 4px; font-size: 1.25em; font-weight: 700; line-height: 1.3; }
.mecanismo-src { text-align: center; padding-top: 12px; }
.mecanismo-src img { width: 100%; max-width: 860px; height: auto; }
</style>
</HEAD>
<script src="./jsmol/JSmol.min.js"></script>
<script src="./jsmol/js/Jmol2.js"></script>
<script>
	// Elementos que se muestran siempre: hélice PPII del conector (249-253) en cian y
	// tirosinas reguladoras en esferas (spacefill): Y416 (bucle de activación) y Y527 (cola C-terminal).
	// En 2SRC la Y527 está fosforilada; su átomo de fósforo se colorea en naranja.
	var tirosinas = "color (249-253) cyan; "
		+ "select 416; spacefill on; color [255,200,0]; "
		+ "select 527; spacefill on; color magenta; select 527 and _P; color [255,128,0]; select *; ";
	// Representación base: cartoon gris (se borran representaciones y etiquetas previas)
	var base = "select *; spacefill off; wireframe off; label off; cartoon on; color gray; ";
	// Vista inicial (sin rotación) equivalente en los dos modelos: 1Y57 se superpuso a 2SRC por los
	// Calfa del dominio SH1 (267-520) y se eligió una dirección de visión en la que se separan
	// SH3, SH2 y SH1. El dominio SH1 ocupa la misma posición y orientación en ambos visores;
	// el mismo rotationRadius garantiza la misma escala.
	var vista = [
		"set rotationRadius 52; moveto 0 {0.3421 -0.8419 0.4173} 163.07 95 0 0 {2.944 34.288 53.227} 52; ",
		"set rotationRadius 52; moveto 0 {-0.0306 -0.7176 -0.6958} 99.85 95 0 0 {-3.376 35.155 43.958} 52; "
	];
	// Comandos comunes a los dos visores
	var estiloInicial = base + "background aliceblue; "
		+ "isosurface superficie select(protein) ignore(not protein) color [245,245,245] vdw translucent 0.9; "
		+ tirosinas;
	// Sitio de unión de SH2 a la fosfotirosina (pY527): residuos a <= 4 Å de pY527 en 2SRC
	var sitioSH2 = "155,175,177,178,179,185,201,203";
	// Sitio de unión de SH3 a la hélice PPII del conector: residuos a <= 4 Å de 249-253 en 2SRC
	var sitioSH3 = "90,91,95,117,118,133,135,136";
	var dominios = {
		SH1:  "color (267-520) green; ",
		SH2:  "color (148-245) red; color (" + sitioSH2 + ") [139,0,0]; "
			+ "select (" + sitioSH2 + ") and (sidechain or *.CA); wireframe 0.3; select *; ",
		SH3:  "color (81-143) blue; color (" + sitioSH3 + ") [0,0,110]; "
			+ "select (" + sitioSH3 + ") and (sidechain or *.CA); wireframe 0.3; select *; "
	};
	// Envía el mismo comando a los dos visores
	function ambos(cmd) {
		Jmol.script(jmolApplet0, cmd);
		Jmol.script(jmolApplet1, cmd);
	}
	function vistaInicial() {
		Jmol.script(jmolApplet0, "spin off; " + vista[0]);
		Jmol.script(jmolApplet1, "spin off; " + vista[1]);
		var r = document.getElementById("rotacion"); if (r) r.checked = false;
	}
	function dominio(d) {
		ambos("cartoon off; " + base + dominios[d] + tirosinas);
	}
</script>
<body>
<font face="Tahoma">
<TABLE class="tabla-src" border="0" cellspacing="5">
<TR>
	<TD class="cabecera-src">
	<CENTER>
	<FONT SIZE="+2" COLOR="#6633CC"><B>cSrc Inactiva</B></FONT>
	<BR>
	<script>
		  jmolInitialize("./jsmol/js");
		  jmolSetParameter("UseCommandThread","true");
		  jmolApplet(420, "load ./pdb/2SRC.pdb.gz; " + estiloInicial + vista[0]);
	</script>
	</CENTER>
	</TD>
	<TD class="controles-src">
		<div class="pila">
			<input type="button" class="b-sh1" value="SH1" onclick="dominio('SH1')">
			<input type="button" class="b-sh2" value="SH2" onclick="dominio('SH2')">
			<input type="button" class="b-sh3" value="SH3" onclick="dominio('SH3')">
			<input type="button" value="Vista inicial" onclick="vistaInicial()">
			<label><input type="checkbox" id="rotacion" onclick="ambos(this.checked ? 'spin on' : 'spin off')"> Rotaci&oacute;n</label>
			<div class="leyenda-src">
				<span style="color:#c89a00">Y416</span>
				<span style="color:#c000c0">Y527</span>
				<span style="color:#00a0a0">H&eacute;lice PPII</span>
			</div>
		</div>
	</TD>
	<TD class="cabecera-src">
	<CENTER>
	<FONT SIZE="+2" COLOR="#6633CC"><B>cSrc Activa</B></FONT>
	<BR>
	<script>
		  jmolApplet(420, "load ./pdb/1Y57.pdb.gz; " + estiloInicial + vista[1]);
	</script>
	</CENTER>
	</TD>
</TR>
<TR>
	<TD colspan="3" class="mecanismo-src">
		<img src="./images/Src.Mecanismo.png" alt="Mecanismo de activaci&oacute;n de Src">
	</TD>
</TR>
</TABLE>
<BR>
</BODY>
</HTML>
