<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../css/moderno.css">
<title>Hemoglobina: formas Tensa y Relajada</title>
<style>
.tyr {
	display: grid;
	grid-template-columns: 422px minmax(170px, 210px) 422px;
	column-gap: 24px;
	row-gap: 28px;
	align-items: start;
	width: max-content;
	max-width: 100%;
}
.tyr-visor { text-align: center; }
.tyr-visor h2 {
	margin: 0 0 10px;
	font-size: 26px;
	font-weight: 500;
	color: var(--ink);
}
.tyr-centro {
	align-self: center;
	margin-top: 44px;
	display: flex;
	flex-direction: column;
	align-items: center;
	gap: 14px;
}
.tyr-botones {
	display: flex;
	flex-direction: column;
	align-items: center;
	gap: 6px;
	padding: 18px 14px;
	background: var(--surface-soft);
	border-radius: var(--radius);
	width: 100%;
	box-sizing: border-box;
}
.tyr-botones input[type="button"] { margin: 3px 0; min-width: 140px; }
#botonRotacion, #botonInicial { min-width: 140px; margin: 0; }
#botonRotacion.activo { background: var(--accent); border-color: var(--accent); color: #fff; }
.tyr-puentes { grid-column: 1; }
.tyr-equilibrio { grid-column: 2 / 4; align-self: center; text-align: center; }
.tyr-puentes img { width: 100%; }
.tyr-equilibrio img { width: 100%; max-width: 560px; }
</style>
<script src="../jsmol/JSmol.min.js"></script>
<script src="../jsmol/js/Jmol2.js"></script>
<script>
	// Colores de las cadenas (los mismos que el esquema de los puentes salinos)
	// A = alfa1, B = beta1, C = alfa2, D = beta2
	var colorCadenas = "select protein and :A; color [0,204,255]; "
		+ "select protein and :B; color [255,0,0]; "
		+ "select protein and :C; color [0,0,255]; "
		+ "select protein and :D; color [255,102,0]; ";

	// Representación inicial: cartoon coloreado por cadenas y grupos hemo en esferas
	var estiloInicial = "select *; spacefill off; wireframe off; backbone off; cartoon on; "
		+ colorCadenas
		+ "select hem; cartoon off; spacefill on; color cpk; select none; ";

	// Orientaciones establecidas en los estados de JSmol (Forma T y Forma R)
	var orientacionT = "moveto 0.0 {16 688 -725 179.36} 120.0 -2.86 0.24 {15.081 1.9395 13.5805} 38.176178644424915 {0 0 0} 0 0 0 3.0 0.0 0.0; ";
	var orientacionR = "moveto 0.0 {-998 56 17 85.67} 120.0 0.0 0.0 {1.1105 0.0175 -0.1725} 37.72741976093302 {0 0 0} 0 0 0 3.0 0.0 0.0; ";

	var ajustes = "background aliceblue; restrict not (solvent or PO4); set spinX 0; set spinY 30; set spinZ 0; set spinFps 30; ";

	// Vista de un puente salino: esqueleto coloreado, residuos en esferas y hemo en varillas
	function puente(seleccion) {
		return "select *; spacefill off; wireframe off; cartoon off; backbone on; "
			+ colorCadenas
			+ "select " + seleccion + "; spacefill on; color cpk; "
			+ "select hem; spacefill off; wireframe 100; color cpk; select none";
	}

	// Envía el mismo comando a los dos visores
	function ambos(cmd) {
		Jmol.script(jmolApplet0, cmd);
		Jmol.script(jmolApplet1, cmd);
	}

	// Activa o detiene la rotación en los dos visores a la vez
	var girando = false;
	function rotacion(boton) {
		girando = !girando;
		ambos(girando ? "spin on" : "spin off");
		boton.value = girando ? "Detener rotación" : "Activar rotación";
		boton.className = girando ? "activo" : "";
	}

	// Recupera en los dos visores la representación y la orientación iniciales
	function vistaInicial() {
		girando = false;
		var boton = document.getElementById("botonRotacion");
		boton.value = "Activar rotación";
		boton.className = "";
		Jmol.script(jmolApplet0, "spin off; " + estiloInicial + orientacionT);
		Jmol.script(jmolApplet1, "spin off; " + estiloInicial + orientacionR);
	}
</script>
</head>
<body>
<div class="tyr">

	<div class="tyr-visor">
		<h2>Conformación T</h2>
		<script>
			jmolInitialize("../jsmol/js");
			jmolSetParameter("UseCommandThread", "true");
			jmolApplet(420, "load ../pdb/deoxyhemoglobina.pdb.gz; " + ajustes + estiloInicial + orientacionT);
		</script>
	</div>

	<div class="tyr-centro">
		<div class="tyr-botones">
			<input type="button" value="His146-Lys40" onclick="ambos(puente('(his146 or lys40) and protein'))">
			<input type="button" value="Asp94-His146" onclick="ambos(puente('(asp94 or his146) and (:B or :D)'))">
			<input type="button" value="Asp126-Arg141" onclick="ambos(puente('(asp126 or arg141) and (:A or :C)'))">
			<input type="button" value="Val1-Arg141" onclick="ambos(puente('(val1 or arg141) and (:A or :C)'))">
		</div>
		<input type="button" id="botonRotacion" value="Activar rotación" onclick="rotacion(this)">
		<input type="button" id="botonInicial" value="Vista inicial" onclick="vistaInicial()">
	</div>

	<div class="tyr-visor">
		<h2>Conformación R</h2>
		<script>
			jmolApplet(420, "load ../pdb/oxyhemoglobina.pdb.gz; " + ajustes + estiloInicial + orientacionR);
		</script>
	</div>

	<div class="tyr-puentes">
		<img src="../images/puentes_salinos.png" alt="La forma T está estabilizada por 8 puentes salinos entre las cadenas alfa1, alfa2, beta1 y beta2">
	</div>

	<div class="tyr-equilibrio">
		<img src="../images/equilibrio_TR.png" alt="Equilibrio entre la desoxihemoglobina (forma Tensa, baja afinidad) y la oxihemoglobina (forma Relajada, alta afinidad)">
	</div>

</div>
</body>
</html>
