<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 3.2 Final//EN">
<HTML>
<HEAD>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<TITLE>Vitaminas y Coenzimas</TITLE>
<META NAME="Generator" CONTENT="EditPlus 1.2">
<META NAME="Author" CONTENT="">
<META NAME="Keywords" CONTENT="">
<META NAME="Description" CONTENT="">
</HEAD>
<script src="./jsmol/JSmol.min.js?v=20261113"></script>
<script src="./jsmol/js/Jmol2.js?v=20261113b"></script>
<style>
.menu-vitaminas optgroup { font-weight: 700; color: #6633CC; }
.menu-vitaminas option { font-weight: 400; color: #13324a; }
.menu-vitaminas option.cabecera { font-weight: 600; color: #5a6977; }
</style>
<script>
	// Carga la molécula elegida en el desplegable (los ficheros están en ./pdb/)
	function cargar(fichero) {
		if (fichero) Jmol.script(jmolApplet0, "load ./pdb/" + fichero + "; cpk on");
	}
</script>
<body>
<font face="Tahoma">
<TABLE border="0" cellspacing="5">
<TR>
	<TD>
	<CENTER>
	<FONT SIZE="+2" COLOR="#6633CC"><B>Vitaminas y Coenzimas</B></FONT>
	<BR>
	<form>
	<script>
		  jmolInitialize("./jsmol/js");
		  jmolSetParameter("UseCommandThread","true");
		  jmolApplet(500, "load ./pdb/retinol.gz; cpk on; background aliceblue");
		  jmolBr();
	</script>
	</form></CENTER>
	</TD>
	<TD valign=top>
		<select id="menuMoleculas" class="menu-vitaminas" onchange="cargar(this.value)" aria-label="Molécula">
		<optgroup label="VITAMINAS LIPOSOLUBLES">
			<option disabled class="cabecera">Vitamina A</option>
			<option value="beta-caroteno.gz">&nbsp;&nbsp;&nbsp;&nbsp;β-caroteno</option>
			<option value="retinol.gz" selected>&nbsp;&nbsp;&nbsp;&nbsp;Retinol</option>
			<option value="All-trans-retinal.gz">&nbsp;&nbsp;&nbsp;&nbsp;All-trans retinal</option>
			<option value="11-cis-retinal.gz">&nbsp;&nbsp;&nbsp;&nbsp;11-cis retinal</option>
			<option value="Colecalciferol.gz">Colecalciferol (D)</option>
			<option value="tocoferol.gz">Tocoferol (E)</option>
			<option disabled class="cabecera">Vitamina K</option>
			<option value="Filoquinona.K1.gz">&nbsp;&nbsp;&nbsp;&nbsp;Filoquinona (K1)</option>
			<option value="Menadiona.K3.gz">&nbsp;&nbsp;&nbsp;&nbsp;Menadiona (K3)</option>
		</optgroup>
			<option value="CoQ.pdb.gz">Coenzima Q</option>
		<optgroup label="VITAMINAS HIDROSOLUBLES">
			<option value="Tiamina.gz">Tiamina (B1)</option>
			<option value="tiamina.pdb.gz">&nbsp;&nbsp;&nbsp;&nbsp;Pirofosfato de tiamina</option>
			<option value="Riboflavina.gz">Riboflavina (B2)</option>
			<option value="fad.pdb.gz">&nbsp;&nbsp;&nbsp;&nbsp;FADH</option>
			<option value="Niacina.gz">Niacina (B3)</option>
			<option value="NADH.gz">&nbsp;&nbsp;&nbsp;&nbsp;NADH</option>
			<option value="NADPH.pdb.gz">&nbsp;&nbsp;&nbsp;&nbsp;NADPH</option>
			<option value="Pantotenico.gz">Acido Pantoténico (B5)</option>
			<option value="coa.pdb.gz">&nbsp;&nbsp;&nbsp;&nbsp;CoA</option>
			<option value="acetilcoa.pdb.gz">&nbsp;&nbsp;&nbsp;&nbsp;Acetil-CoA</option>
			<option disabled class="cabecera">Vitamina B6</option>
			<option value="Piridoxamina.gz">&nbsp;&nbsp;&nbsp;&nbsp;Piridoxamina (B6)</option>
			<option value="Piridoxal.fosfato.gz">&nbsp;&nbsp;&nbsp;&nbsp;Piridoxal fosfato</option>
			<option value="Biotina.gz">Biotina (B7)</option>
			<option value="Tetrahidrofolato.gz">Tetrahidrofolato (B9)</option>
			<option value="Metilentetrahidrofolato.gz">&nbsp;&nbsp;&nbsp;&nbsp;N⁵-N¹⁰-metilen Tetrahidrofolato</option>
			<option value="metilcobalamina.6Co.unido.gz">Cobalamina (B12)</option>
			<option disabled class="cabecera">Vitamina C</option>
			<option value="ascorbato.gz">&nbsp;&nbsp;&nbsp;&nbsp;Ascorbato</option>
			<option value="dehidroascorbato.gz">&nbsp;&nbsp;&nbsp;&nbsp;Dehidroascorbato</option>
		</optgroup>
		</select>
		<P>
		<script>
			jmolButton("select *; spacefill 100%;isosurface off", "x");
		</script> Esferas de Van der Walls
		<p>
		<script>
			jmolButton("select *; spacefill 25%; isosurface off", "x");
		</script> Modelo de esferas y varillas
		<P>
		<script>
			jmolButton("select *; spacefill 25%; isosurface ignore(solvent)molecular; color isosurface translucent", "x");
		</script> Modelo de esferas y varillas (superfice transparente)
		<P>
		<script>
			jmolButton("select *; spacefill off; isosurface off", "x");
		</script> Modelo de varillas
		<P>
		<script>
			jmolCheckbox("set spinX 10; set spinY 10; spin on", "spin off", "Rotaci&oacute;n")
		</script> 	
	</TD>
</TR>
</BODY>
</HTML>
