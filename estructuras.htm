<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Atlas de estructuras</title>
<!-- Antigua página con marcos. Los enlaces del tipo estructuras.htm?p=SRC.htm
     siguen funcionando: se redirigen a la página indicada (ahora con su propio índice). -->
<script>
(function () {
  var p = new URLSearchParams(location.search).get("p");
  var destino = (p && /^(proteinas\/)?[\w.\-]+\.html?$/i.test(p)) ? p : "atlas.htm";
  location.replace(destino + location.hash);
})();
</script>
<noscript><meta http-equiv="refresh" content="0; url=atlas.htm"></noscript>
</head>
<body><p><a href="atlas.htm">Atlas de estructuras</a></p></body>
</html>
